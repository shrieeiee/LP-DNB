# Builds the Windows programs, runs the self-tests and publishes a GitHub release
# with LP-DNB-windows.zip, either
#   - when a version tag is pushed:  git tag v1.3.1 && git push origin v1.3.1
#   - or from the Actions tab: "Run workflow" with a version (1.3.1); the tag
#     v1.3.1 is made on the commit it runs on. Leave the version empty to just
#     build the zip (it's attached to the run).
# The release text comes from packaging/release-notes.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.3.1 (empty = just build the zip)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 2>&1 | Tee-Object configure.log
          if ($LASTEXITCODE) { Get-Content configure.log -Tail 40 | % { "::error::$_" }; exit 1 }
          cmake --build build --config Release --parallel 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE) {
            # Errors as annotations, so they show on the run's summary page.
            Select-String -Path build.log -Pattern ': (fatal )?error ' | Select-Object -First 40 | % { "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Self-test
        working-directory: build
        run: .\Release\lp-dnb-tests.exe

      - name: Package
        shell: pwsh
        run: |
          $commit = (git rev-parse --short HEAD).Trim()
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart('v') }
                     elseif ("${{ inputs.version }}") { "${{ inputs.version }}".TrimStart('v') } else { "dev" }
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          New-Item -ItemType Directory -Force LP-DNB-windows | Out-Null
          Copy-Item build\Release\lp-dnb.exe, build\Release\lp-tenori.exe, THIRD-PARTY-NOTICES.txt, LICENSE LP-DNB-windows\
          (Get-Content packaging\READ-ME.txt -Raw).Replace('VERSION', $version).Replace('COMMIT', $commit) |
            Set-Content -NoNewline LP-DNB-windows\READ-ME.txt
          Compress-Archive -Path LP-DNB-windows -DestinationPath LP-DNB-windows.zip -Force
          New-Item -ItemType Directory -Force LP-DNB-windows-symbols | Out-Null
          Copy-Item build\Release\lp-dnb.pdb, build\Release\lp-tenori.pdb LP-DNB-windows-symbols\
          Compress-Archive -Path LP-DNB-windows-symbols -DestinationPath LP-DNB-windows-symbols.zip -Force
          (Get-Content packaging\release-notes.md -Raw).Replace('COMMIT', $commit) | Set-Content -NoNewline release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: LP-DNB-windows
          path: |
            LP-DNB-windows.zip
            LP-DNB-windows-symbols.zip

      - name: Publish the release
        if: github.ref_type == 'tag' || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: LP-DNB ${{ env.VERSION }}
          body_path: release-notes.md
          files: |
            LP-DNB-windows.zip
            LP-DNB-windows-symbols.zip
